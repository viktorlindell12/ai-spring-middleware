<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Middleware Chat</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            width: 640px;
            max-width: 95vw;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px;
        }

        .header {
            padding: 20px 24px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header h1 { font-size: 1.1rem; color: #111; }
        .header p { font-size: 0.8rem; color: #6b7280; margin-top: 2px; }

        select {
            margin-left: auto;
            padding: 6px 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.85rem;
            background: white;
            cursor: pointer;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 0.9rem;
            line-height: 1.5;
            white-space: pre-wrap;
        }

        .message.user {
            background: #2563eb;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .message.assistant {
            background: #f3f4f6;
            color: #111;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .message.error {
            background: #fef2f2;
            color: #dc2626;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            padding: 16px 24px;
            border-top: 1px solid #e5e7eb;
            display: flex;
            gap: 10px;
        }

        textarea {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: none;
            height: 44px;
            line-height: 1.5;
        }

        textarea:focus { outline: none; border-color: #2563eb; }

        button {
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.9rem;
            cursor: pointer;
            white-space: nowrap;
        }

        button:disabled { background: #93c5fd; cursor: not-allowed; }
        button:hover:not(:disabled) { background: #1d4ed8; }

        .welcome {
            background: #f3f4f6;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            padding: 14px 16px;
            font-size: 0.9rem;
            color: #374151;
            line-height: 1.6;
            align-self: flex-start;
            max-width: 85%;
        }

        .welcome strong { color: #111; }

        .typing {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 12px 16px;
            background: #f3f4f6;
            border-radius: 12px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
        }

        .typing span {
            width: 8px;
            height: 8px;
            background: #9ca3af;
            border-radius: 50%;
            animation: bounce 1.2s infinite;
        }

        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-6px); }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>AI Middleware Chat</h1>
            <p>Powered by OpenRouter</p>
        </div>
        <label for="personality" style="position:absolute;width:1px;height:1px;overflow:hidden">Personality</label>
        <select id="personality" aria-label="Select personality">
            <option value="helper">Helper</option>
            <option value="coder">Coder</option>
            <option value="pirate">Pirate</option>
        </select>
    </div>

    <div class="messages" id="messages" aria-live="polite" aria-label="Chat messages">
        <div class="welcome">
            <strong>Welcome!</strong> Choose a personality in the top right, then start chatting.<br><br>
            🧑‍💻 <strong>Coder</strong> — helps with programming, code reviews and technical questions<br>
            🤝 <strong>Helper</strong> — a friendly assistant for general questions<br>
            🏴‍☠️ <strong>Pirate</strong> — answers everything like a pirate, arrr!
        </div>
    </div>

    <div class="input-area">
        <label for="input" style="position:absolute;width:1px;height:1px;overflow:hidden">Message</label>
        <textarea id="input" placeholder="Type a message..." rows="1" aria-label="Type a message"></textarea>
        <button id="send">Send</button>
    </div>
</div>

<script>
    const sessionId = crypto.randomUUID?.() ?? Math.random().toString(36).slice(2) + Date.now();
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const personalityEl = document.getElementById('personality');

    function addMessage(text, role) {
        const div = document.createElement('div');
        div.className = `message ${role}`;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typing';
        div.innerHTML = '<span></span><span></span><span></span>';
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function removeTyping() {
        document.getElementById('typing')?.remove();
    }

    let sending = false;

    async function send() {
        const message = inputEl.value.trim();
        if (!message || sending) return;

        sending = true;
        inputEl.value = '';
        sendBtn.disabled = true;
        addMessage(message, 'user');
        showTyping();

        try {
            const res = await fetch('/api/v1/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    personality: personalityEl.value,
                    message,
                    sessionId
                })
            });

            removeTyping();

            let data;
            try {
                data = await res.json();
            } catch {
                addMessage('Unexpected response from server.', 'error');
                return;
            }

            if (!res.ok) {
                addMessage(data.error || 'Something went wrong.', 'error');
            } else {
                addMessage(data.response ?? 'No response received.', 'assistant');
            }
        } catch (e) {
            removeTyping();
            addMessage('Could not reach the server.', 'error');
        } finally {
            sending = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }
    }

    sendBtn.addEventListener('click', send);
    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
</script>
</body>
</html>
